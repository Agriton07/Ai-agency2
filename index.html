    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AKJ.ai",
      "url": "https://akj.ai",

      }
    }
    </script>

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#a78bfa" />
    <meta name="color-scheme" content="light dark" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts loaded early to prevent FOUT -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=Space+Grotesk:wght@700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Inline theme init: runs before React to eliminate flash of unstyled content -->
    <script>
      (function(){try{var t=localStorage.getItem("arp-theme")||"light",r=document.documentElement;if(t==="dark"){r.style.setProperty("--bg-primary","#0f0e0d");r.style.setProperty("--bg-secondary","#1a1917");r.style.setProperty("--bg-tertiary","#232220");r.style.setProperty("--bg-card","#1e1d1b");r.style.setProperty("--bg-input","#242220");r.style.setProperty("--text-primary","#f5f0eb");r.style.setProperty("--text-secondary","#a8a29e");r.style.setProperty("--text-muted","#6b6560");r.style.setProperty("--border","rgba(255,255,255,0.08)");r.style.setProperty("--border-hover","rgba(255,255,255,0.15)");r.style.setProperty("--shadow-sm","0 2px 12px rgba(0,0,0,0.4)");r.style.setProperty("--shadow-md","0 8px 32px rgba(0,0,0,0.5)");r.style.setProperty("--shadow-lg","0 20px 60px rgba(0,0,0,0.6)");r.style.setProperty("--nav-bg","rgba(15,14,13,0.92)");r.style.setProperty("--hero-bg","#0f0e0d");r.style.setProperty("--section-alt","#141312");r.setAttribute("data-theme","dark");}else{r.style.setProperty("--bg-primary","#ffffff");r.style.setProperty("--bg-secondary","#fafafa");r.style.setProperty("--bg-tertiary","#f5f3f0");r.style.setProperty("--bg-card","#ffffff");r.style.setProperty("--bg-input","#ffffff");r.style.setProperty("--text-primary","#1c1917");r.style.setProperty("--text-secondary","#57534e");r.style.setProperty("--text-muted","#a8a29e");r.style.setProperty("--border","#e7e5e4");r.style.setProperty("--border-hover","#d4d0cc");r.style.setProperty("--shadow-sm","0 2px 12px rgba(0,0,0,0.06)");r.style.setProperty("--shadow-md","0 8px 32px rgba(0,0,0,0.08)");r.style.setProperty("--shadow-lg","0 20px 60px rgba(0,0,0,0.10)");r.style.setProperty("--nav-bg","rgba(250,250,250,0.92)");r.style.setProperty("--hero-bg","#fafafa");r.style.setProperty("--section-alt","#f5f3f0");r.setAttribute("data-theme","light");}}catch(e){}})();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
