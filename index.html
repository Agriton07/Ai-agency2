<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->

    <meta name="keywords" content="AI automation agency, AI chatbot, voice agent, workflow automation, CRM automation, lead generation AI, business automation" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="AKJ.ai" />

    <!-- Canonical -->
    <link rel="canonical" href="https://akj.ai/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://akj.ai/" />
    <meta property="og:site_name" content="AKJ.ai" />
    <meta property="og:title" content="AKJ.ai — AI Automation Agency" />
    <meta property="og:description" content="AI chatbots, voice agents, and workflow automation. Fixed pricing. Live in 1–3 weeks. No enterprise budget required." />
    <meta property="og:image" content="https://akj.ai/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AKJ.ai — AI Automation Agency" />
    <meta name="twitter:description" content="AI chatbots, voice agents, and workflow automation. Fixed pricing. Live in 1–3 weeks." />
    <meta name="twitter:image" content="https://akj.ai/og-image.png" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AKJ.ai",
      "url": "https://akj.ai",
      "logo": "https://akj.ai/favicon.svg",
      "description": "AI automation agency specialising in chatbots, voice agents, and workflow automation.",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@akj.ai",
        "contactType": "customer support"
      }
    }
    </script>

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#a78bfa" />
    <meta name="color-scheme" content="light dark" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts loaded early to prevent FOUT -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=Space+Grotesk:wght@700;800&display=swap"
